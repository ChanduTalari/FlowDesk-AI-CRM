<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      name="description"
      content="AI-powered lead-to-CRM workflow dashboard"
    />
    <title>FlowDesk · AI CRM</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236366f1'/%3E%3Cstop offset='1' stop-color='%234338ca'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Cg stroke='white' stroke-width='6' stroke-linecap='round'%3E%3Cpath d='M18 12v40M18 21h25M18 35h16' fill='none'/%3E%3C/g%3E%3Ccircle cx='43' cy='21' r='6' fill='white'/%3E%3Ccircle cx='34' cy='35' r='4.8' fill='white'/%3E%3C/svg%3E"
    />
    <script>
      try {
        var stored = localStorage.getItem("flowdesk.theme");
        var prefersDark = window.matchMedia(
          "(prefers-color-scheme: dark)",
        ).matches;
        var dark = stored === "dark" || (!stored && prefersDark);
        if (dark) {
          document.documentElement.classList.add("dark");
        }
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) {
          meta.setAttribute("content", dark ? "#000000" : "#f8fafc");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
